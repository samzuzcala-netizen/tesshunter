[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesshunter"
version = "0.1.0"
description = "TESS exoplanet transit candidate search pipeline"
requires-python = ">=3.10"
dependencies = [
    "lightkurve>=2.4",
    "astropy>=5.3",
    "astroquery>=0.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "tabulate>=0.9",
]

[project.optional-dependencies]
speed = ["numba>=0.60"]
survey = ["batman-package>=2.5", "numba>=0.60"]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

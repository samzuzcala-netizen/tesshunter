# Known exoplanet targets used for pipeline validation.
# These targets have confirmed transits detected by TESS.
# Source: NASA Exoplanet Archive / ExoFOP-TESS.
#
# The purpose of this file is to verify the pipeline recovers
# known signals before any unknown candidate search is attempted.

targets:
  - name: "WASP-126 b"
    tic_id: 25155310
    known_period_days: 3.2883
    known_depth_ppt: 2.5        # parts per thousand
    notes: "Hot Jupiter, bright host, clean signal. Good first validation target."

  - name: "TOI-132 b"
    tic_id: 286923464
    known_period_days: 1.01153
    known_depth_ppt: 1.2
    notes: "Short period sub-Saturn. Recovered in TESS Sector 1."

  - name: "HD 21749 b"  # TOI-186
    tic_id: 279741551
    known_period_days: 35.6136
    known_depth_ppt: 0.38
    notes: "Sub-Neptune with longer period. Tests sensitivity at shallow depth."

  - name: "TOI-700 d"
    tic_id: 150428135
    known_period_days: 37.4241
    known_depth_ppt: 0.2
    notes: "Earth-sized planet in habitable zone. Harder target — low depth."
